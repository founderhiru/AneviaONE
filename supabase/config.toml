# Supabase CLI project config (used by `npx supabase link` / `npx supabase db push`).
# Only the technical project id lives here — it is NOT the consumer brand name.
project_id = "health-intelligence-app"

# Gate 1 document understanding. The gateway verifies the caller's JWT; the
# function verifies it again and derives the user only from it.
[functions.process-document]
verify_jwt = true
import_map = "./functions/deno.json"

# Gate 2: deterministic Health Memory / Timeline / Trends / What Changed.
# Reads as the caller (anon key + JWT) — RLS applies; no AI, no service role.
[functions.health-memory]
verify_jwt = true
import_map = "./functions/deno.json"

# Gate 3: grounded Ask My Health. Reads as the caller (RLS).
[functions.ask-health]
verify_jwt = true
import_map = "./functions/deno.json"

# Phase B: a person deletes one of their documents (ownership checked server-side).
[functions.delete-document]
verify_jwt = true
import_map = "./functions/deno.json"

# Email sign-in. The app's code screen (components/OtpInput.tsx) takes exactly
# 6 digits — keep the emailed code the same length (docs/SUPABASE_SETUP.md §4).
# Declared here so `supabase config diff` shows any drift; the mobile test
# auth-email-config.test.ts fails if the two ever disagree.
[auth.email]
otp_length = 6
